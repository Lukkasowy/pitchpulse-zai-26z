services:
  - type: web
    name: pitchpulse-zai-26z
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health
    preDeployCommand: dotnet PitchPulse.Api.dll --migrate --create-admin
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pitchpulse-zai-26z-db
          property: connectionString
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: 'true'
      - key: Admin__Username
        value: admin
      - key: Admin__Password
        sync: false

databases:
  - name: pitchpulse-zai-26z-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: '17'
    databaseName: pitchpulse
    user: pitchpulse
    ipAllowList: []
